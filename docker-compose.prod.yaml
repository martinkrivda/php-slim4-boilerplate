services:
  app:
    container_name: php-slim4-boilerplate
    image: your-registry/php-slim4-boilerplate:latest
    ports:
      - "80:80"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
